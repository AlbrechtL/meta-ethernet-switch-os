BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ethernet-switch-os"
BBFILE_PATTERN_ethernet-switch-os = "^${LAYERDIR}/"
BBFILE_PRIORITY_ethernet-switch-os = "7"

# Deliberately no dependency on a BSP layer (rtl83xx-bsp,
# rpi-managed-switch-bsp): the image .bbappends only apply where the BSP's
# image recipes exist.
# networking-layer: net-snmp.
LAYERDEPENDS_ethernet-switch-os = "core openembedded-layer networking-layer swupdate"
LAYERSERIES_COMPAT_ethernet-switch-os = "wrynose"

# The image .bbappends have no recipe to attach to when the BSP layer is absent,
# and the .swu recipes package the BSP's rtl83xx-image; only parse them with it.
BBFILES_DYNAMIC += " \
    rtl83xx-bsp:${LAYERDIR}/dynamic-layers/rtl83xx-bsp/*/*/*.bb \
    rtl83xx-bsp:${LAYERDIR}/dynamic-layers/rtl83xx-bsp/*/*/*.bbappend \
    rpi-managed-switch-bsp:${LAYERDIR}/dynamic-layers/rpi-managed-switch-bsp/*/*/*.bb \
    rpi-managed-switch-bsp:${LAYERDIR}/dynamic-layers/rpi-managed-switch-bsp/*/*/*.bbappend \
    qemu-switch-bsp:${LAYERDIR}/dynamic-layers/qemu-switch-bsp/*/*/*.bb \
    qemu-switch-bsp:${LAYERDIR}/dynamic-layers/qemu-switch-bsp/*/*/*.bbappend \
"
