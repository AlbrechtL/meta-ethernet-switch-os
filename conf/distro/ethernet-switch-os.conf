# poky-tiny plus the userspace policy for Ethernet switches: clixon, which
# configures the network, dropbear and SWUpdate. Selected with the built-in
# fragment:
#
#   bitbake-config-build disable-fragment distro/poky-tiny
#   bitbake-config-build enable-fragment distro/ethernet-switch-os

require conf/distro/poky-tiny.conf

DISTRO = "ethernet-switch-os"
DISTRO_NAME = "Ethernet Switch OS"
DISTROOVERRIDES = "poky:poky-tiny:ethernet-switch-os"

# poky-tiny opts out of every distro feature, including sysvinit. Without it
# update-rc.d.bbclass skips populate_packages_updatercd, so no /etc/rc*.d links
# are created and busybox' rcS starts nothing. This keeps busybox as init and
# mdev as device manager (init-manager-mdev-busybox.inc); it only turns on the
# SysV script machinery.
DISTRO_FEATURES:append = " sysvinit"

# packagegroup-core-boot recommends init-ifupdown with sysvinit, whose
# /etc/network/interfaces runs DHCP on eth0 -- the DSA conduit, which must not
# carry an address. The clixon-switch backend plugin configures the network.
BAD_RECOMMENDATIONS += "init-ifupdown"
