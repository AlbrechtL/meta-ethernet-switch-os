# Deltas over ethernet-switch-os.cfg for the A/B Raspberry Pi switch, which
# keeps U-Boot as bootloader interface (/etc/fw_env.config: /boot/uboot.env).

# No flash to write: the "raw" handler (on in the defconfig) writes the root
# filesystem slot, "rawfile" the kernel onto /boot.
# CONFIG_MTD is not set
# CONFIG_CFI is not set

# The "bootenv" section of sw-description (rootpart, upgrade_available,
# bootcount) is applied by the bootloader handler. Without it SWUpdate rejects
# the .swu: "bootloader support absent but sw-description has bootloader
# section!"
CONFIG_BOOTLOADERHANDLER=y
