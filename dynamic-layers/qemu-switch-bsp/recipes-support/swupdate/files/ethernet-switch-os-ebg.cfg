# Deltas over ethernet-switch-os.cfg for the emulated QEMU switch, which boots
# through EFI Boot Guard. SWUpdate loads libebgenv at run time
# (dlopen("libebgenv.so.0")); swupdate.inc adds efibootguard to DEPENDS and
# RDEPENDS for it.
CONFIG_BOOTLOADER_EBG=y
CONFIG_BOOTLOADER_DEFAULT_EBG=y
# CONFIG_UBOOT is not set

# No flash to write: the "raw" handler (on in the defconfig) writes the root
# filesystem slot, "rawfile" the kernel onto the config partition.
# CONFIG_MTD is not set
# CONFIG_CFI is not set

# The "bootenv" section of sw-description (kernelfile, kernelparams) is
# applied by the bootloader handler. Without it SWUpdate rejects the .swu:
# "bootloader support absent but sw-description has bootloader section!"
CONFIG_BOOTLOADERHANDLER=y
