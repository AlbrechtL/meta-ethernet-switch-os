# triggerhappy rules: <event> <value> <command>. Value 1 is press, 0 release.
# A DIP switch reads as pressed while it is on.

# Reset: reboot on release, or factory reset when held for 5 seconds or more.
KEY_RESTART	1	/usr/sbin/ethernet-switch-os-reset-key press
KEY_RESTART	0	/usr/sbin/ethernet-switch-os-reset-key release

# DIP switches without a function yet, logged so they can be checked.
BTN_0	1	logger -t dip-switch "BTN_0 on"
BTN_0	0	logger -t dip-switch "BTN_0 off"
BTN_1	1	logger -t dip-switch "BTN_1 on"
BTN_1	0	logger -t dip-switch "BTN_1 off"
BTN_2	1	logger -t dip-switch "BTN_2 on"
BTN_2	0	logger -t dip-switch "BTN_2 off"
BTN_3	1	logger -t dip-switch "BTN_3 on"
BTN_3	0	logger -t dip-switch "BTN_3 off"
BTN_4	1	logger -t dip-switch "BTN_4 on"
BTN_4	0	logger -t dip-switch "BTN_4 off"
