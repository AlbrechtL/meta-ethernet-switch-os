# Deltas over meta-swupdate's defconfig for RTL83xx. Refine with
# "bitbake -c menuconfig swupdate" + "bitbake -c diffconfig swupdate".

# No Lua (saves the interpreter and its handlers).
# CONFIG_LUA is not set
# CONFIG_LUASCRIPTHANDLER is not set

# sha256 per image in sw-description. Without it the parser rejects any
# description that carries a hash ("hash verification not enabled but hash
# supplied"), and dropping the hashes is no option with a single firmware
# slot: the image must be verified before "firmware" is erased.
#
# HASH_VERIFY needs an SSL implementation. openssl costs no flash here, since
# clixon already puts libcrypto and libssl into both images. The web server
# itself stays plain HTTP: no MONGOOSESSL, no signed or encrypted images yet.
# CONFIG_SSL_IMPL_NONE is not set
CONFIG_SSL_IMPL_OPENSSL=y
CONFIG_HASH_VERIFY=y
# CONFIG_MONGOOSESSL is not set
# CONFIG_SIGNED_IMAGES is not set
# CONFIG_ENCRYPTED_IMAGES is not set

# The kernel is built without IPv6.
# CONFIG_MONGOOSEIPV6 is not set

# U-Boot environment through libubootenv. No sw-description writes it today
# (no bootenv, both markers off), but SWUpdate needs a bootloader backend and
# this one matches the board. /etc/fw_env.config (the main environment, mtd1)
# comes from rtl83xx-ubootenv-config.
#
# CONFIG_UBOOT_DEFAULTENV stays at its default, /etc/u-boot-initial-env, and
# nothing may install that file: when the environment cannot be read, SWUpdate
# falls back to it and would store it over u-boot-env, bootcmd included.
# Without the file an env write fails instead, and the environment is left
# alone.
CONFIG_UBOOT=y
# CONFIG_BOOTLOADER_NONE is not set
CONFIG_UBOOT_FWENV="/etc/fw_env.config"

# "flash" handler for the SPI-NOR partitions ("firmware", "data").
CONFIG_MTD=y
CONFIG_CFI=y

# Web UI.
CONFIG_WEBSERVER=y
CONFIG_MONGOOSE=y
