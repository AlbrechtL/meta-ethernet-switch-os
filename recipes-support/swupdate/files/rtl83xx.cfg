# Deltas over meta-swupdate's defconfig for RTL83xx.
#
# For now only the daemon and its web UI: no bootloader integration and no
# flash handlers until the board has a flashable squashfs/MTD layout. Refine
# with "bitbake -c menuconfig swupdate" + "bitbake -c diffconfig swupdate".

# No Lua (saves the interpreter and its handlers).
# CONFIG_LUA is not set
# CONFIG_LUASCRIPTHANDLER is not set

# No TLS: no signed/encrypted images yet, and it keeps openssl out of swupdate.
CONFIG_SSL_IMPL_NONE=y
# CONFIG_SSL_IMPL_OPENSSL is not set
# CONFIG_MONGOOSESSL is not set

# The kernel is built without IPv6.
# CONFIG_MONGOOSEIPV6 is not set

# No bootloader environment yet. Switch to CONFIG_UBOOT with an fw_env.config
# for the u-boot-env partition once updates are written to flash.
CONFIG_BOOTLOADER_NONE=y
# CONFIG_UBOOT is not set

# Flash handlers come with the flash layout.
# CONFIG_MTD is not set
# CONFIG_CFI is not set

# Web UI.
CONFIG_WEBSERVER=y
CONFIG_MONGOOSE=y
