# HTTPS front end of Ethernet Switch OS: TLS and the password check for
# everything on the web, in front of two servers that listen on 127.0.0.1
# only and do neither.
#
#   https://<switch>/          web interface (static files)
#   https://<switch>/restconf  clixon_restconf, 127.0.0.1:80
#   https://<switch>/update/   SWUpdate's page, 127.0.0.1:8080
#
# The login is HTTP basic auth for the admin account cli, checked against
# /etc/lighttpd/htpasswd, which ethernet-switch-os-set-password writes with
# the bcrypt hash from /etc/shadow. Until the first password is set the file
# is empty and only the two setup URLs below answer.
#
# The certificate is self-signed and made on the first boot by
# /etc/init.d/lighttpd.
#
# Written without regular expressions (=~): lighttpd is built without pcre.

server.modules = (
    "mod_openssl",
    "mod_auth",
    "mod_authn_file",
    "mod_proxy",
)

server.port = 443
server.username = "lighttpd"
server.groupname = "lighttpd"
server.pid-file = "/run/lighttpd.pid"
server.errorlog-use-syslog = "enable"
server.tag = ""
# Request bodies that wait for the backend: /var/tmp is root's, /tmp is RAM
# for everyone. SWUpdate keeps the .swu in /tmp anyway.
server.upload-dirs = ( "/tmp" )

ssl.engine = "enable"
ssl.pemfile = "/etc/ethernet-switch-os/tls/cert.pem"
ssl.privkey = "/etc/ethernet-switch-os/tls/key.pem"

server.document-root = "/usr/share/ethernet-switch-os/www"
index-file.names = ( "index.html" )
mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".js"   => "text/javascript; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".svg"  => "image/svg+xml",
    ".png"  => "image/png",
    ".ico"  => "image/x-icon",
    ".json" => "application/json",
    ".txt"  => "text/plain; charset=utf-8",
)

auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/etc/lighttpd/htpasswd"
# The hash is bcrypt, made to be slow, and the web interface sends several
# requests every few seconds. A checked login is
# kept for 10 minutes. ethernet-switch-os-set-password restarts lighttpd, so
# a changed password takes effect at once.
auth.cache = ( "max-age" => "600" )

# The static files of the web interface hold no data and are served without
# a login, so the page can show the setup form. Everything that reads or
# changes the switch needs the password.
$HTTP["url"] =^ "/restconf" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 80 ) ) )
    auth.require = ( "" => (
        "method" => "basic",
        "realm" => "Ethernet Switch OS",
        "require" => "user=cli",
    ) )
    # First-login setup, without a login. The RPC protects itself: once a
    # password is set it needs the current one.
    $HTTP["url"] == "/restconf/operations/clixon-switch:set-password" {
        $HTTP["request-method"] == "POST" {
            auth.require = ()
        }
    }
    $HTTP["url"] == "/restconf/data/clixon-switch:system/state/setup-required" {
        $HTTP["request-method"] == "GET" {
            auth.require = ()
        }
    }
}
else $HTTP["url"] =^ "/.well-known/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 80 ) ) )
}
# SWUpdate's page uses relative URLs only, so it works below /update/. The
# prefix is stripped towards SWUpdate; its progress messages come over a
# WebSocket (/update/ws). The .swu is passed on while it is uploaded instead
# of being stored first: it would not fit into RAM twice.
else $HTTP["url"] =^ "/update/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8080 ) ) )
    proxy.header = (
        "map-urlpath" => ( "/update/" => "/" ),
        "upgrade" => "enable",
    )
    server.stream-request-body = 2
    server.stream-response-body = 2
    auth.require = ( "" => (
        "method" => "basic",
        "realm" => "Ethernet Switch OS",
        "require" => "user=cli",
    ) )
}
