name: Check layer

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The images are built in AlbrechtL/ethernet-switch-os, which owns the build
# configuration -- which layers, which branches, which machine. Nothing is
# pinned here any more, so there is nothing to keep in step.
#
# This is the fast check that the layer still works inside that
# configuration: the real layer set and the real machine, but no task is
# executed. It catches a recipe that does not parse, a broken .bbappend, a
# missing dependency and an unsatisfiable image in minutes. Run the build
# workflow over there for the images themselves.

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BOARD: zyxel-gs1900-8-a1

    steps:
      # First, because actions/checkout writes into a subdirectory of it.
      - name: Get the build configuration
        run: git clone --depth 1 https://github.com/AlbrechtL/ethernet-switch-os build

      - uses: actions/checkout@v4
        with:
          path: build/layers/meta-ethernet-switch-os

      # kas would otherwise fetch this layer from master and check the commit
      # under test back out. A repository with no url gets no version control
      # operations at all, so the checkout above is used as it is.
      - name: Test this checkout, not master
        run: |
          cat > build/kas/opt/this-layer.yml <<'YAML'
          header:
            version: 23
          repos:
            meta-ethernet-switch-os:
              url: null
              branch: null
              path: layers/meta-ethernet-switch-os
          YAML

      # bitbake isolates tasks with unprivileged user namespaces, which
      # Ubuntu's AppArmor restricts by default. A host setting; the container
      # inherits it.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The upstream kas image, not the project's own: a parse needs none of
      # the extras in it, and pulling it is faster than building one.
      - name: Parse
        working-directory: build
        run: |
          ./kas-container shell \
              "kas/board/$BOARD.yml:kas/opt/this-layer.yml" \
              -c "bitbake -n ethernet-switch-os-swu-factory ethernet-switch-os-swu-upgrade"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parse-logs
          path: build/build/tmp/log/
          if-no-files-found: ignore
          retention-days: 7
